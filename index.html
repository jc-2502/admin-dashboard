<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <title>Admin dashboard</title>
    <link href='style.css' rel='stylesheet'>
  </head>
  <body>
    <div class='sidebar grid'>
      <div class='logo-and-dashboard-name grid column'>
        <div class='logo placeholder-border'></div>
        <h1 class='dashboard-name'>Dashboard</h1>
      </div>
      <div class='navigation grid'>
        <ul class='navigation-top grid'>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Home</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Profile</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Messages</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>History</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Tasks</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Communities</div>
          </li>
        </ul>
        <ul class='navigation-bottom grid'>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Settings</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Support</div>
          </li>
          <li class='navigation-item'>
            <div class='navigation-item-icon'></div>
            <div class='navigation-item-text'>Privacy</div>
          </li>
        </ul>
      </div>
    </div>
    <div class='header grid'>
      <div class='search-section grid column'>
        <div class='search-icon placeholder-border'></div>
        <div class='search-box placeholder-border'></div>
      </div>
      <div class='user-section grid column'>
        <div class='alerts placeholder-border'></div>
        <div class='profile-picture placeholder-border'></div>
        <div class='name'>Morgan Oakley</div>
      </div>
    </div>
    <div class='main-content grid'>

    </div>
  </body>
</html>
